function payRzp(o){const open=()=>{new Razorpay({key:o.razorpay.keyId,amount:o.razorpay.amount,currency:"INR",name:"APNA BAZAR",order_id:o.razorpay.orderId,handler:async x=>{try{await api("/payments/razorpay/verify",{method:"POST",body:{orderId:o.orderId,...x}});toast("Payment successful");go("order-"+o.orderId)}catch(e){toast(e.message)}},modal:{ondismiss:()=>{toast("Payment not completed");go("order-"+o.orderId)}}}).open()};if(window.Razorpay)return open();const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=open;s.onerror=()=>toast("Could not load Razorpay");document.head.append(s)}
pdx=function(p){return `<div class="row" style="margin-top:8px"><button class="chip" data-sh="${p.id}">Share</button></div><div class="box" style="margin-top:10px"><b>Report this listing</b><div class="row" style="margin-top:6px"><select class="f" id="rpr" style="margin:0"><option>Misleading information</option><option>Fake or scam</option><option>Prohibited item</option><option>Wrong category</option></select><button class="btn s o" data-xrp="${p.id}">Report</button></div></div><div class="box" style="margin-top:10px"><b>Check delivery</b><div class="row" style="margin-top:6px"><input class="f" id="pn" inputmode="numeric" placeholder="PIN code" style="margin:0"><button class="btn s" data-pin="1">Check</button></div><div class="mu" id="pr" style="margin-top:6px"></div></div><div id="rvx" class="box"><div class="mu">Loading reviews…</div></div>`};
async function drawRev(id){const el=$("#rvx");if(!el)return;try{const l=await api("/products/"+id+"/reviews"),avg=l.length?(l.reduce((a,b)=>a+b.stars,0)/l.length).toFixed(1):null;
 el.innerHTML=`<b>Ratings &amp; reviews</b> ${avg?`<span class="tag">★ ${avg} (${l.length})</span>`:""}${l.map(x=>`<div style="margin-top:8px"><b>${"★".repeat(x.stars)}${"☆".repeat(5-x.stars)}</b> ${H(x.name)} <span class="tag">Verified purchase</span><div class="mu">${H(x.body)}</div></div>`).join("")||`<div class="mu">No reviews yet.</div>`}${S.token?`<div style="margin-top:10px"><select class="f" id="rs">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join("")}</select><input class="f" id="rt" placeholder="Write your review"><button class="btn s" data-xrv="${id}">Submit review</button><div class="mu">Only customers who bought this product can review it.</div></div>`:`<div class="mu" style="margin-top:8px">Login to write a review.</div>`}`}catch(e){el.textContent="Could not load reviews"}}
R.messages=()=>{if(!S.token){S.pend="messages";go("login");return ""}return `<div id="mx"><div class="cn">Loading…</div></div>`};
async function drawMsgs(){const el=$("#mx");if(!el)return;try{const th=await api("/messages/threads");let conv="";if(OPEN){const m=await api(`/messages?productId=${OPEN.p}&buyerId=${OPEN.b}`);conv=`<div class="box"><b>Conversation</b>${m.map(x=>{const me=x.sender_id==S.myid;return `<div style="padding:8px 12px;border-radius:14px;margin:6px 0;max-width:85%;${me?"margin-left:auto;background:var(--g);color:#fff":"background:var(--g2)"}">${H(x.body)}</div>`}).join("")}<div class="row"><input class="f" id="mi" placeholder="Type a message" style="margin:0"><button class="btn s" data-mm="1">Send</button></div></div>`}
 el.innerHTML=`<h2>Messages</h2>${conv}${th.map(t=>`<div class="box" data-ot="${t.product_id}:${t.buyer_id}" style="cursor:pointer"><b>${H(t.title)}</b>${t.unread?` <span class="tag">${t.unread} new</span>`:""}<div class="mu">${H(t.last_message)}</div></div>`).join("")||`<div class="cn"><b>💬</b>No conversations yet.<br>Message a seller from a product page.</div>`}`}catch(e){el.innerHTML=`<div class="cn">${H(e.message)}</div>`}}
R.addresses=()=>{if(!S.token){S.pend="addresses";go("login");return ""}return `<div id="ax"><div class="cn">Loading…</div></div>`};
async function drawAddr(){const el=$("#ax");if(!el)return;try{ADR=await api("/addresses");el.innerHTML=`<h2>Address book</h2>${ADR.map(a=>`<div class="box"><b>${H(a.label)}</b> ${a.is_default?'<span class="tag">default</span>':""}<div class="mu">${H(a.name)}, ${H(a.line)}, PIN ${H(a.pin)} · ${H(a.phone)}</div><div class="row" style="margin-top:6px">${a.is_default?"":`<button class="btn s o" data-adef="${a.id}">Make default</button>`}<button class="btn s o" data-adel="${a.id}">Delete</button></div></div>`).join("")||`<div class="cn">No saved addresses.</div>`}<div class="box"><b>Add address</b><select class="f" id="xl" style="margin-top:8px"><option>Home</option><option>Office</option><option>Other</option></select><input class="f" id="xn" placeholder="Full name"><input class="f" id="xp" inputmode="numeric" placeholder="Mobile (10 digits)"><input class="f" id="xa" placeholder="House no, street, area"><input class="f" id="xz" inputmode="numeric" placeholder="PIN code"><button class="btn" data-aadd="1">Save address</button></div>`}catch(e){el.innerHTML=`<div class="cn">${H(e.message)}</div>`}}
R.account=()=>{if(!S.token){S.pend="account";go("login");return ""}return `<h2>Edit profile</h2><div class="box"><input class="f" id="un" value="${H(S.user.name)}" placeholder="Name"><input class="f" id="ue" placeholder="Email (optional)"><input class="f" id="uc" value="${H(S.user.city)}" placeholder="City">${S.user.role=="seller"?`<input class="f" id="us" value="${H(S.user.shop)}" placeholder="Shop name">`:""}<button class="btn" data-up="1">Save</button></div><h2>Change password</h2><div class="box"><input class="f" id="pc" type="password" placeholder="Current password"><input class="f" id="pn2" type="password" placeholder="New password (min 8)"><button class="btn" data-pw="1">Change password</button></div><h2>Delete account</h2><div class="box"><div class="mu">Send a request to delete your account and data. The team reviews it.</div><button class="btn s o" data-del="1" style="margin-top:8px">Request deletion</button></div>`};
R.forgot=()=>`<h2>Reset password</h2><div class="box"><input class="f" id="fm" inputmode="numeric" placeholder="Mobile number"><button class="btn s" data-fo="1">Send OTP</button><input class="f" id="fc" inputmode="numeric" placeholder="OTP" style="margin-top:8px"><input class="f" id="fp" type="password" placeholder="New password (min 8)"><button class="btn" data-fr="1">Reset password</button><div class="mu" id="fh" style="margin-top:6px"></div></div>`;
document.addEventListener("click",e=>{const t=e.target.closest("[data-eq]");if(!t)return;e.stopImmediatePropagation();if(!S.token){S.pend="product-"+t.dataset.eq;go("login");return}const body=$("#em").value.trim()||"Is this still available?";api("/messages",{method:"POST",body:{productId:+t.dataset.eq,body}}).then(()=>{toast("Message sent");go("messages")}).catch(err=>toast(err.message))},true);
document.addEventListener("click",async e=>{const t=e.target.closest("[data-xrv],[data-xrp],[data-ot],[data-mm],[data-adef],[data-adel],[data-aadd],[data-up],[data-pw],[data-del],[data-fo],[data-fr]");if(!t)return;const d=t.dataset,v=i=>$(i).value.trim();
 try{
 if(d.xrv){await api("/products/"+d.xrv+"/reviews",{method:"PUT",body:{stars:+$("#rs").value,body:v("#rt")}});toast("Review saved");return drawRev(d.xrv)}
 if(d.xrp){await api("/products/"+d.xrp+"/report",{method:"POST",body:{reason:$("#rpr").value}});return toast("Report received, thank you")}
 if(d.ot){const[p,b]=d.ot.split(":");OPEN={p:+p,b:+b};return drawMsgs()}
 if(d.mm){const body=v("#mi");if(!body||!OPEN)return;await api("/messages",{method:"POST",body:{productId:OPEN.p,buyerId:OPEN.b,body}});return drawMsgs()}
 if(d.adel){await api("/addresses/"+d.adel,{method:"DELETE"});return drawAddr()}
 if(d.adef){const a=ADR.find(x=>x.id==d.adef);await api("/addresses/"+a.id,{method:"PUT",body:{label:a.label,name:a.name,phone:a.phone,line:a.line,city:a.city||undefined,pin:a.pin,is_default:true}});return drawAddr()}
 if(d.aadd){await api("/addresses",{method:"POST",body:{label:$("#xl").value,name:v("#xn"),phone:v("#xp"),line:v("#xa"),pin:v("#xz"),is_default:false}});toast("Address saved");return drawAddr()}
 if(d.up){const j=await api("/auth/me",{method:"PATCH",body:{name:v("#un"),email:v("#ue")||undefined,city:v("#uc")||undefined,shop_name:$("#us")?v("#us"):undefined}});S.user={...S.user,name:j.user.name,city:j.user.city||"",shop:j.user.shop_name||S.user.shop};sv();return toast("Profile updated")}
 if(d.pw){await api("/auth/password/change",{method:"POST",body:{current:$("#pc").value,password:$("#pn2").value}});$("#pc").value=$("#pn2").value="";return toast("Password changed")}
 if(d.del){await api("/auth/delete-request",{method:"POST"});return toast("Deletion request sent")}
 if(d.fo){const j=await api("/auth/otp/send",{method:"POST",body:{mobile:v("#fm")}});return $("#fh").textContent=j.devOtp?"Development OTP: "+j.devOtp:"OTP sent by SMS"}
 if(d.fr){await api("/auth/password/reset",{method:"POST",body:{mobile:v("#fm"),code:v("#fc"),password:$("#fp").value}});toast("Password reset. Please login");go("login")}
 }catch(err){toast(err.message)}});
const _r3=render;render=function(){const h=(location.hash||"#home").slice(1);_r3();if(h.startsWith("product-"))drawRev(h.slice(8));if(h=="messages")drawMsgs();if(h=="addresses")drawAddr()};
}

let CK={},CATL=[],SADS=[];
async function loadCats(){CATL=await api("/categories");CK={};CATL.filter(c=>c.parent_id).forEach(c=>{const p=CATL.find(x=>x.id==c.parent_id);if(p)(CK[p.name]=CK[p.name]||[]).push(c.name)})}
document.head.insertAdjacentHTML("beforeend","<style>#ft{display:none;text-align:center;padding:28px 16px;color:var(--m);font-size:13px}@media(min-width:900px){#ft{display:block}}</style>");
if(ONLINE){
const H=s=>esc(String(s==null?"":s));
R.categories=()=>`<h2>All categories</h2>${CATL.filter(c=>!c.parent_id).map(c=>`<div class="box"><div class="row sp" data-go="search" data-cat="${H(c.name)}" style="cursor:pointer"><b>${c.icon||"📦"} ${H(c.name)}</b><span class="mu">${c.products} ›</span></div>${(CK[c.name]||[]).length?`<div class="hs" style="margin-top:8px">${CK[c.name].map(n=>`<button class="chip" data-go="search" data-cat="${H(n)}">${H(n)}</button>`).join("")}</div>`:""}</div>`).join("")}`;
R.seller=id=>`<div id="sp"><div class="cn">Loading…</div></div>`;
async function drawSellerPage(id){const el=$("#sp");if(!el)return;try{const s=await api("/sellers/"+id),l=P.filter(p=>p.sid==id);
 el.innerHTML=`<div class="box"><h2 style="margin:0">${H(s.shop_name)} ${s.verified?'<span class="tag">✔ Verified</span>':""}</h2><div class="mu">📍 ${H(s.city||"")} · ⭐ ${s.rating||"–"} (${s.reviews||0} reviews) · ${s.active} active · ${s.sold} sold</div></div><h2>Products</h2>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="cn">No active products.</div>`}`}catch(e){el.innerHTML=`<div class="cn">${H(e.message)}</div>`}}
async function drawHome(){const el=$("#lx");if(!el)return;const city=S.user&&S.user.city;
 try{const[g,l]=await Promise.all([api("/groups"),city?api("/local-deals?city="+encodeURIComponent(city)):[]]);
 el.innerHTML=(g.length?`<h2>Group deals</h2>${g.map(x=>`<div class="box"><b>${x.emoji||"📦"} ${H(x.title)}</b><div class="mu"><b>${inr(x.group_price)}</b> instead of ${inr(x.price)} when ${x.target} people join</div><div style="height:8px;border-radius:4px;background:var(--l);margin:8px 0"><div style="height:8px;border-radius:4px;background:var(--g);width:${Math.min(100,x.joined/x.target*100)}%"></div></div><div class="row sp"><span class="mu">${x.joined}/${x.target} joined · ends ${new Date(x.ends_at).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>${x.member?`<span class="tag">${x.reached?"Unlocked: add to cart":"Joined"}</span>`:`<button class="btn s" data-gj="${x.id}">Join</button>`}</div></div>`).join("")}`:"")
 +(l.length?`<h2>Local deals in ${H(city)}</h2><div class="hs">${l.map(x=>`<div class="card" style="width:160px" data-go="product-${x.id}"><div class="im">${x.emoji||"📦"}</div><div class="cb"><div class="pn">${H(x.title)}</div><span class="pr">${inr(x.price)}</span><span class="mo">${inr(x.mrp)}</span><div class="mu">${H(x.shop_name||"")}</div></div></div>`).join("")}</div>`:(S.user&&!city?`<div class="mu" style="margin:8px 0">Add your city in Edit profile to see local deals.</div>`:""))}catch(e){}}
R.requests=()=>{if(!S.token){S.pend="requests";go("login");return ""}return `<div id="rq"><div class="cn">Loading…</div></div>`};
async function drawReq(){const el=$("#rq");if(!el)return;try{const l=await api("/requests/mine");el.innerHTML=`<h2>Request a product</h2><div class="box"><input class="f" id="rb" placeholder="What are you looking for?"><input class="f" id="rc" placeholder="City" value="${H(S.user.city)}"><button class="btn" data-rqa="1">Send request</button><div class="mu">Sellers in the marketplace can see open requests.</div></div><h2>My requests</h2>${l.map(x=>`<div class="box"><b>${H(x.text)}</b><div class="mu">${H(x.city||"")} · <span class="tag">${x.status}</span></div></div>`).join("")||`<div class="cn">No requests yet.</div>`}`}catch(e){el.innerHTML=`<div class="cn">${H(e.message)}</div>`}}
function loadGsi(){if(!CFG.googleClientId||!$("#gbtn"))return;const run=()=>{google.accounts.id.initialize({client_id:CFG.googleClientId,callback:r=>googleLogin(r.credential)});google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",text:"continue_with"})};if(window.google&&google.accounts)return run();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=run;document.head.append(s)}

document.addEventListener("click",async e=>{const t=e.target.closest("[data-gj],[data-rqa],[data-se],[data-ss],[data-av],[data-agd],[data-akc],[data-xpay],#pv");if(!t)return;const d=t.dataset,v=i=>$(i).value.trim();
 try{
 if(t.id=="pv"){const price=+v("#ap3")||0,p={id:0,n:v("#at2")||"Your title",b:S.user.shop||"",c:"",p:price,o:Math.max(+v("#ao")||0,price),r:0,s:1,e:"📦",cond:v("#ak"),city:v("#aci"),sel:S.user.shop||""};$("#pvx").innerHTML=`<div style="width:170px;margin-top:8px">${card(p).replace('data-go="product-0"',"").replace('data-w="0"',"")}</div><div class="mu">${H(v("#ad"))}</div>`;return}
 if(d.gj){if(!S.token){S.pend="home";go("login");return}await api("/groups/"+d.gj+"/join",{method:"POST"});toast("You joined the group deal");return drawHome()}
 if(d.rqa){await api("/requests",{method:"POST",body:{text:v("#rb"),city:v("#rc")||undefined}});toast("Request sent");return drawReq()}
 if(d.se){const a=SADS.find(x=>x.id==d.se),box=t.closest(".box");if(!a||box.querySelector(".ef"))return;box.insertAdjacentHTML("beforeend",`<div class="ef" style="margin-top:8px"><input class="f" id="e1" value="${H(a.title)}"><div class="row"><input class="f" id="e2" inputmode="numeric" value="${a.price}"><input class="f" id="e3" inputmode="numeric" value="${a.stock}"></div><div class="row"><select class="f" id="e4">${["New","Used","Refurbished"].map(c=>`<option ${c==a.cond?"selected":""}>${c}</option>`).join("")}</select><input class="f" id="e5" value="${H(a.city||"")}"></div><input class="f" id="e6" value="${H(a.description||"")}"><button class="btn s" data-ss="${a.id}">Save changes</button></div>`);return}
 if(d.ss){await api("/seller/ads/"+d.ss,{method:"PATCH",body:{title:v("#e1"),price:+v("#e2"),stock:+v("#e3"),cond:$("#e4").value,city:v("#e5"),description:v("#e6")}});toast("Listing updated");await loadP();return drawSeller()}
 if(d.av){const[i,x]=d.av.split(":");await api("/admin/users/"+i,{method:"PATCH",body:{verified:x=="1"}});toast("Saved");return drawAdmin()}
 if(d.agd){await api("/admin/groups",{method:"POST",body:{product_id:+$("#gp").value,target:+v("#gt"),group_price:+v("#gpr"),days:+v("#gdy")}});toast("Group deal created");return drawAdmin()}
 if(d.akc){await api("/admin/categories",{method:"POST",body:{name:v("#kn"),parent_id:$("#kp").value?+$("#kp").value:undefined}});toast("Category added");await loadCats();return drawAdmin()}
 if(d.xpay){const o=await api("/orders/"+d.xpay+"/pay",{method:"POST"});return payRzp(o)}
 }catch(err){toast(err.message)}});
const _r4=render;render=function(){const h=(location.hash||"#home").slice(1);_r4();if(h=="home")drawHome();if(h=="requests")drawReq();if(h.startsWith("seller-"))drawSellerPage(h.slice(7));if(h=="login")loadGsi()};
}

async function boot(){if(ONLINE){S.ads=[];S.adm=null;try{await loadP();try{CFG=await api("/config")}catch(e){}try{await loadCats()}catch(e){}if(S.token){try{S.myid=(await api("/auth/me")).user.id;await pullCart();await pullOrders();await pullNotes();await pullWish()}catch(e){S.token=null;S.user=null}}S.wish=S.wish.filter(i=>pid(i))}catch(e){toast("Cannot reach the server")}}syncAds();upd();render()}

addEventListener("hashchange",render);boot();
